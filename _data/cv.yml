- title: Research Profile
  type: list
  contents:
    - Postdoctoral scholar developing vascularized organ-on-chip disease models that integrate mechanobiology, biomaterials, stem cell engineering, single-cell sequencing, and spatial omics.
    - Research focuses on how the cellular microenvironment, extracellular matrix composition, matrix mechanics, and tissue architecture regulate stem cell maintenance, expansion, differentiation, and disease-relevant phenotypes.
    - Long-term goal is to build clinically relevant microphysiological models for therapeutic discovery, regenerative medicine, and mechanistic studies of development and disease.

